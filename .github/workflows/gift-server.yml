# Deploys the TofuBot gift server (the Cloudflare Worker in _gift-server/) whenever it changes,
# and keeps tofubot/gift/api.txt pointing at it. Needs the repository secret CLOUDFLARE_API_TOKEN
# (Cloudflare token from the "Edit Cloudflare Workers" template, plus Account > D1 > Edit).
name: TofuBot gift server

on:
  push:
    branches: [main]
    paths:
      - "_gift-server/**"
      - ".github/workflows/gift-server.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: gift-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Add the CLOUDFLARE_API_TOKEN repository secret, then run this workflow again."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == '1'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == '1'
        with:
          node-version: 22

      - name: Deploy the Worker and the database
        if: steps.token.outputs.ok == '1'
        env:
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$ACCOUNT" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"; fi
          bash _gift-server/deploy.sh

      - name: Save the server address for the gift page and the bots
        if: steps.token.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- tofubot/gift/api.txt; then
            echo "api.txt is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tofubot/gift/api.txt
          git commit -m "Gift server address"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || echo "Pages will rebuild on its own"
